apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: todo-broadcaster:ex-4.6-slack
          imagePullPolicy: IfNotPresent

          env:
            - name: NATS_URL
              value: "nats://my-nats.nats.svc.cluster.local:4222"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: broadcaster-secret
                  key: SLACK_WEBHOOK_URL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
