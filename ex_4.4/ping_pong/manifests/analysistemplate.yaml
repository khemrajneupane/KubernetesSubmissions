apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ping-pong-cpu-check
  namespace: exercises
spec:
  metrics:
    - name: namespace-cpu-usage
      initialDelay: 1m
      interval: 1m
      count: 5
      successCondition: result[0] < 0.1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            sum(
              rate(
                container_cpu_usage_seconds_total{
                  namespace="exercises",
                  container!="",
                  image!=""
                }[5m]
              )
            )
