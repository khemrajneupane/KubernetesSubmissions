apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:ex-1.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
