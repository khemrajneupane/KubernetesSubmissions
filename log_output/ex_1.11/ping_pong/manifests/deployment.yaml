apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-pvc

      containers:
        - name: ping-pong
          image: ping-pong:pingpong_ex-1.11

          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files
