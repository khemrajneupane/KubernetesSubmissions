apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: default
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16
              env:
                - name: PGPASSWORD
                  value: postgres
              command: ["/bin/sh", "-c"]
              args:
                - pg_dump -h todo-postgres-svc -U postgres -d postgres > /backup/todo-backup-$(date -u +%Y-%m-%dT%H-%M-%SZ).sql
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: todo-backup-pvc
