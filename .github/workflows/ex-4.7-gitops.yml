name: Exercise 4.7 Log output GitOps

on:
  push:
    branches:
      - main
    paths:
      - ex_4.7/log_output/Dockerfile
      - ex_4.7/log_output/index.js
      - .github/workflows/ex-4.7-gitops.yml

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ex_4.7/log_output
          push: true
          tags: khemrajneupane/log-output:sha-${{ github.sha }}

      - name: Update Deployment image tag
        run: |
          sed -i "s|image: khemrajneupane/log-output:.*|image: khemrajneupane/log-output:sha-${GITHUB_SHA}|" ex_4.7/log_output/manifests/deployment.yaml

      - name: Commit and push updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ex_4.7/log_output/manifests/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update Log output image to sha-${GITHUB_SHA}"
          git push
